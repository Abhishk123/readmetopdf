<div class="progress-wrapper" [ngClass]="['status-' + status]">
  <div class="progress-header">
    <div class="status-indicator">
      @if (status === 'converting' || status === 'reading') {
        <span class="spinner"></span>
      } @else if (status === 'completed') {
        <svg class="check-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
      } @else if (status === 'error') {
        <svg class="error-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
      }
      <span class="progress-message">{{ message }}</span>
    </div>
    <span class="progress-percentage">{{ percentage }}%</span>
  </div>

  <div class="progress-track">
    <div class="progress-fill" [style.width.%]="percentage"></div>
  </div>
</div>
